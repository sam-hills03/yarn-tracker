<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Crochet Stash & Projects</title>
  <meta name="theme-color" content="#d97768" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c96459;
      --primary-light: #fbeee9;
      --accent: #5b8266;
      --accent-light: #e8f0eb;
      --stat-purple: #70587c;
      --stat-purple-light: #f3edf7;
      --bg: #f8f6f2;
      --card-bg: #ffffff;
      --text: #2c2724;
      --text-muted: #736b63;
      --border: #eadfce;
      --radius: 16px;
      --shadow: 0 4px 16px rgba(44, 39, 36, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 95px;
    }
    header {
      background: var(--card-bg);
      padding: 14px 18px 10px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
    .sync-status {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: #eee;
      color: #666;
      cursor: pointer;
    }
    .sync-status.synced { background: var(--accent-light); color: var(--accent); }
    .sync-status.syncing { background: #fff3cd; color: #856404; }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      background: #faf8f5;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); background: #fff; }
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 18px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    main { padding: 8px 16px; }
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .card-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: #f0ebe4;
      color: #63574c;
    }
    .tag.scrap { background: #feebe8; color: #b84335; }
    .tag.project { background: var(--accent-light); color: var(--accent); }
    .tag.status-complete { background: #d4edda; color: #155724; }
    .tag.status-ready { background: #cce5ff; color: #004085; }
    .tag.status-doing { background: #d1ecf1; color: #0c5460; }
    .card-notes {
      font-size: 0.85rem;
      color: var(--text);
      background: #faf8f5;
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      gap: 10px;
    }
    select.assign-select {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.82rem;
      background: #fbf9f6;
    }
    .btn-action {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #b84335;
      font-size: 0.8rem;
      padding: 6px;
      cursor: pointer;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px;
    }
    .rough-note-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .link-btn {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-metric-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 8px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .stat-val { font-size: 1.3rem; font-weight: 700; color: var(--stat-purple); margin-bottom: 2px; }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; line-height: 1.1; }
    .chart-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .chart-box h3 { font-size: 0.95rem; color: var(--text); margin-bottom: 12px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 0.82rem; }
    .bar-label { width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-weight: 500; }
    .bar-track { flex: 1; height: 14px; background: #f1ecf5; border-radius: 7px; overflow: hidden; }
    .bar-fill { height: 100%; background: #c3b4db; border-radius: 7px; }
    .bar-count { width: 26px; text-align: right; font-weight: 700; color: var(--text-muted); }

    /* Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #fff;
      display: flex;
      border-top: 1px solid var(--border);
      z-index: 30;
    }
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
    }
    .tab-btn.active { color: var(--primary); }
    .fab {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: none;
      box-shadow: 0 6px 20px rgba(201, 100, 89, 0.4);
      cursor: pointer;
      z-index: 25;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: flex-end;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #fff;
      width: 100%;
      max-height: 88vh;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .checkbox-row { display: flex; gap: 16px; margin: 12px 0; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .cancel-btn {
      width: 100%;
      padding: 10px;
      background: none;
      color: var(--text-muted);
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <h1 id="view-title">Yarn Stash</h1>
      <span id="sync-indicator" class="sync-status" onclick="fetchFromSheet()">🔄 Syncing...</span>
    </div>
    <input type="text" id="search-bar" class="search-input" placeholder="Search..." />
  </header>

  <div class="filter-chips" id="filter-container">
    <button class="chip active" onclick="setFilter('all')">All</button>
    <button class="chip" onclick="setFilter('unassigned')">Available</button>
    <button class="chip" onclick="setFilter('in-project')">In Project</button>
    <button class="chip" onclick="setFilter('scrap')">Scraps</button>
    <button class="chip" onclick="setFilter('DK')">DK</button>
    <button class="chip" onclick="setFilter('Chunky')">Chunky</button>
  </div>

  <main>
    <!-- Stash View -->
    <div id="yarn-list" class="card-list"></div>

    <!-- Projects & Ideas View -->
    <div id="projects-view" style="display:none;">
      <div class="section-title">✨ Project Planner</div>
      <div id="planner-list" class="card-list"></div>

      <div class="section-title">💡 Other Ideas & Wishlist</div>
      <div id="ideas-list" class="card-list"></div>

      <div class="section-title">📝 Quick Notes</div>
      <div id="notes-list"></div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <input type="text" id="quick-note-input" class="search-input" placeholder="Add rough idea or reminder..." />
        <button class="chip active" onclick="saveQuickNote()">Add</button>
      </div>
    </div>

    <!-- Stats View -->
    <div id="stats-view" style="display:none;">
      <div class="stats-grid">
        <div class="stat-metric-card">
          <div class="stat-val" id="metric-proj">0%</div>
          <div class="stat-label">% with projects</div>
        </div>
        <div class="stat-metric-card">
          <div class="stat-val" id="metric-new">0%</div>
          <div class="stat-label">% new</div>
        </div>
        <div class="stat-metric-card">
          <div class="stat-val" id="metric-scrap">0%</div>
          <div class="stat-label">% scrap</div>
        </div>
      </div>

      <div class="chart-box">
        <h3>Count of Weight</h3>
        <div id="weight-bars"></div>
      </div>

      <div class="chart-box">
        <h3>Count of Colour</h3>
        <div id="colour-bars"></div>
      </div>
    </div>
  </main>

  <button class="fab" id="main-fab" onclick="handleFabClick()">+</button>

  <nav class="tab-bar">
    <button class="tab-btn active" id="tab-yarn" onclick="switchTab('yarn')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      Stash
    </button>
    <button class="tab-btn" id="tab-projects" onclick="switchTab('projects')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      Projects & Ideas
    </button>
    <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
      Stats
    </button>
  </nav>

  <!-- Add Yarn Modal -->
  <div class="modal" id="add-yarn-modal">
    <div class="modal-content">
      <h2 style="font-size: 1.2rem; margin-bottom: 14px;">Add New Yarn</h2>
      <div class="form-group">
        <label>Brand / Name</label>
        <input type="text" id="new-name" placeholder="e.g. Hayfield Spirit" required />
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Weight</label>
          <select id="new-weight">
            <option value="DK">DK</option>
            <option value="Aran">Aran</option>
            <option value="Chunky">Chunky</option>
            <option value="Super Chunky">Super Chunky</option>
            <option value="Fine">Fine</option>
            <option value="Macrame">Macrame</option>
            <option value="Cord">Cord</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;">
          <label>Hook Size</label>
          <input type="text" id="new-hook" placeholder="e.g. 4" />
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Colour</label>
          <input type="text" id="new-colour" placeholder="e.g. Blue" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Shade</label>
          <input type="text" id="new-shade" placeholder="e.g. 402" />
        </div>
      </div>
      <div class="checkbox-row">
        <label class="checkbox-item"><input type="checkbox" id="new-is-scrap" /> Scrap</label>
        <label class="checkbox-item"><input type="checkbox" id="new-has-tag" checked /> Tag Intact</label>
      </div>
      <div class="form-group">
        <label>Assign to Project (Optional)</label>
        <input type="text" id="new-project" placeholder="e.g. Hexagon Cardigan" />
      </div>
      <button class="submit-btn" onclick="saveNewYarn()">Save to Stash</button>
      <button class="cancel-btn" onclick="closeModal('add-yarn-modal')">Cancel</button>
    </div>
  </div>

  <!-- Add Idea Modal -->
  <div class="modal" id="add-idea-modal">
    <div class="modal-content">
      <h2 style="font-size: 1.2rem; margin-bottom: 14px;">Add Project / Idea</h2>
      <div class="form-group">
        <label>Project / Pattern Name</label>
        <input type="text" id="idea-name" placeholder="e.g. Granny Square Cardigan" required />
      </div>
      <div class="form-group">
        <label>Pattern Link (URL)</label>
        <input type="url" id="idea-link" placeholder="e.g. https://ravelry.com/..." />
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Where</label>
          <input type="text" id="idea-where" placeholder="Etsy, TikTok, Ravelry" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Paid (£)</label>
          <input type="number" id="idea-paid" placeholder="0" />
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Yarn Needed</label>
          <input type="text" id="idea-yarn" placeholder="DK Cotton & Mohair" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Hook</label>
          <input type="text" id="idea-hook" placeholder="5" />
        </div>
      </div>
      <div class="form-group">
        <label>Status / Doing?</label>
        <select id="idea-doing">
          <option value="Not started">Not started</option>
          <option value="Yes">Yes (In progress)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes / Thoughts</label>
        <textarea id="idea-notes" rows="2" placeholder="e.g. Need to buy yarn, looks tricky"></textarea>
      </div>
      <button class="submit-btn" onclick="saveNewIdea()">Save Idea</button>
      <button class="cancel-btn" onclick="closeModal('add-idea-modal')">Cancel</button>
    </div>
  </div>

  <!-- Edit Planner Modal -->
  <div class="modal" id="edit-planner-modal">
    <div class="modal-content">
      <h2 style="font-size: 1.2rem; margin-bottom: 14px;">Edit Project</h2>
      <input type="hidden" id="edit-p-row" />
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="edit-p-name" required />
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Pattern Source</label>
          <input type="text" id="edit-p-pattern" placeholder="Bought / Freehand" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Status</label>
          <select id="edit-p-status">
            <option value="Ready to go">Ready to go</option>
            <option value="In progress">In progress</option>
            <option value="Need fabric">Need fabric</option>
            <option value="Complete">Complete</option>
          </select>
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Yarn</label>
          <input type="text" id="edit-p-yarn" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Hook</label>
          <input type="text" id="edit-p-hook" />
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="edit-p-notes" rows="2"></textarea>
      </div>
      <button class="submit-btn" onclick="saveEditedPlanner()">Update Project</button>
      <button class="delete-btn" style="width:100%; text-align:center; margin-top:8px;" onclick="deletePlannerItem()">Delete this Project</button>
      <button class="cancel-btn" onclick="closeModal('edit-planner-modal')">Cancel</button>
    </div>
  </div>

  <!-- Edit Idea Modal -->
  <div class="modal" id="edit-idea-modal">
    <div class="modal-content">
      <h2 style="font-size: 1.2rem; margin-bottom: 14px;">Edit Idea / Wishlist</h2>
      <input type="hidden" id="edit-i-row" />
      <div class="form-group">
        <label>Project / Pattern Name</label>
        <input type="text" id="edit-i-name" required />
      </div>
      <div class="form-group">
        <label>Pattern Link (URL)</label>
        <input type="url" id="edit-i-link" />
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Where</label>
          <input type="text" id="edit-i-where" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Paid (£)</label>
          <input type="number" id="edit-i-paid" />
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Yarn Needed</label>
          <input type="text" id="edit-i-yarn" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>Hook</label>
          <input type="text" id="edit-i-hook" />
        </div>
      </div>
      <div class="form-group">
        <label>Doing?</label>
        <select id="edit-i-doing">
          <option value="Not started">Not started</option>
          <option value="Yes">Yes (In progress)</option>
          <option value="-">-</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="edit-i-notes" rows="2"></textarea>
      </div>
      <button class="submit-btn" onclick="saveEditedIdea()">Update Idea</button>
      <button class="delete-btn" style="width:100%; text-align:center; margin-top:8px;" onclick="deleteIdeaItem()">Delete this Idea</button>
      <button class="cancel-btn" onclick="closeModal('edit-idea-modal')">Cancel</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyL4si7OB71uYZJnrrtJb79gaitfdGcpkRwtM_T8S_kAhZBHFf3mhpLnMg4KB7b2oqZyw/exec";

    // Permanent default projects from sheet
    const DEFAULT_PLANNER = [
      { rowIndex: 3, name: "Hexagon Cardigan", pattern: "Bought", yarn: "Hayfield Spirit DK - Bliss", hook: "4", status: "Complete", notes: "For Me" },
      { rowIndex: 4, name: "Teardrops Clothes Basket", pattern: "NO", yarn: "N/A T-shirt yarn - Green", hook: "8", status: "Complete", notes: "For Home" },
      { rowIndex: 5, name: "Leaf Bandana", pattern: "Bought", yarn: "Hayfield Spirit DK - Casper", hook: "4", status: "Complete", notes: "For Lily" },
      { rowIndex: 6, name: "Butterfly Cardigan", pattern: "Bought", yarn: "Hayfield Bonus DK - Fawn", hook: "4", status: "Ready to go", notes: "For Sam" },
      { rowIndex: 7, name: "White and Blue Scarf", pattern: "Freehand", yarn: "Hayfield Spirit Chunky - Blue", hook: "6 (Tunisian)", status: "Need fabric", notes: "?" }
    ];

    const DEFAULT_IDEAS = [
      { rowIndex: 11, name: "Bifurca Pullover", patternLink: "https://ravelry.com", where: "Ravelry", paid: 8, yarn: "-", hook: "-", doing: "-", notes: "Looks hard" },
      { rowIndex: 12, name: "Crochet Cable Cardi", patternLink: "https://joslincrochet.com", where: "Online", paid: 5, yarn: "DK Cotton & Mohair", hook: "5", doing: "Not started", notes: "Not got the yarn" },
      { rowIndex: 13, name: "Willow Sweater", patternLink: "https://etsy.com", where: "Etsy", paid: 11, yarn: "3x Acrylic Mohair", hook: "6 & 4.5", doing: "Not started", notes: "Lowkey expensive" },
      { rowIndex: 14, name: "Tattoo Banner", patternLink: "", where: "Freehand", paid: 0, yarn: "-", hook: "-", doing: "Not started", notes: "Need to design" },
      { rowIndex: 15, name: "Granny Sweater", patternLink: "https://tiktok.com", where: "TikTok", paid: 0, yarn: "Any DK/Aran", hook: "5", doing: "Yes", notes: "Need to decide" },
      { rowIndex: 16, name: "Bedside Holder", patternLink: "https://pin.it", where: "Pinterest", paid: 0, yarn: "Green T-shirt yarn", hook: "-", doing: "Yes", notes: "Sticks drying" },
      { rowIndex: 17, name: "Off the Shoulder Top", patternLink: "https://pin.it", where: "Pinterest", paid: 0, yarn: "DK Spairs", hook: "-", doing: "Yes", notes: "Ready to go" },
      { rowIndex: 18, name: "Butterfly Tapestry", patternLink: "https://pin.it", where: "Pinterest", paid: 0, yarn: "Fine", hook: "-", doing: "Not started", notes: "Need yarn" }
    ];

    const DEFAULT_ROUGH = [
      "Tunisian sweater with colour work",
      "granny square back long cardi",
      "Tapestries - just need two colours that compliment",
      "Tunisian crochet hooks with cables!"
    ];

    let stash = JSON.parse(localStorage.getItem('stash_data')) || [];
    let planner = JSON.parse(localStorage.getItem('planner_data')) || DEFAULT_PLANNER;
    let ideas = JSON.parse(localStorage.getItem('ideas_data')) || DEFAULT_IDEAS;
    let roughNotes = JSON.parse(localStorage.getItem('notes_data')) || DEFAULT_ROUGH;

    let activeTab = 'yarn';
    let currentFilter = 'all';

    function setSyncStatus(state, text) {
      const el = document.getElementById('sync-indicator');
      el.className = 'sync-status ' + state;
      el.innerText = text;
    }

    async function fetchFromSheet() {
      setSyncStatus('syncing', 'Syncing...');
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.yarn && data.yarn.length) stash = data.yarn;
        if (data.planner && data.planner.length) planner = data.planner;
        if (data.ideas && data.ideas.length) ideas = data.ideas;
        if (data.roughNotes && data.roughNotes.length) roughNotes = data.roughNotes;

        localStorage.setItem('stash_data', JSON.stringify(stash));
        localStorage.setItem('planner_data', JSON.stringify(planner));
        localStorage.setItem('ideas_data', JSON.stringify(ideas));
        localStorage.setItem('notes_data', JSON.stringify(roughNotes));

        setSyncStatus('synced', '✓ Synced');
        render();
      } catch (err) {
        console.error(err);
        setSyncStatus('', 'Offline (Cached)');
        render();
      }
    }

    async function postAction(payload) {
      setSyncStatus('syncing', 'Saving...');
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        setTimeout(fetchFromSheet, 1200);
      } catch (err) {
        setSyncStatus('', 'Save failed');
      }
    }

    function getAllProjectsList() {
      const set = new Set();
      planner.forEach(p => set.add(p.name));
      ideas.forEach(i => set.add(i.name));
      stash.forEach(s => { if (s.project) set.add(s.project); });
      return Array.from(set).filter(Boolean).sort();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-yarn').classList.toggle('active', tab === 'yarn');
      document.getElementById('tab-projects').classList.toggle('active', tab === 'projects');
      document.getElementById('tab-stats').classList.toggle('active', tab === 'stats');

      document.getElementById('filter-container').style.display = tab === 'yarn' ? 'flex' : 'none';
      document.getElementById('search-bar').style.display = tab === 'stats' ? 'none' : 'block';
      document.getElementById('main-fab').style.display = tab === 'stats' ? 'none' : 'flex';

      document.getElementById('yarn-list').style.display = tab === 'yarn' ? 'flex' : 'none';
      document.getElementById('projects-view').style.display = tab === 'projects' ? 'block' : 'none';
      document.getElementById('stats-view').style.display = tab === 'stats' ? 'block' : 'none';

      if (tab === 'yarn') document.getElementById('view-title').innerText = 'Yarn Stash';
      if (tab === 'projects') document.getElementById('view-title').innerText = 'Projects & Ideas';
      if (tab === 'stats') document.getElementById('view-title').innerText = 'Stash Stats';

      render();
    }

    function handleFabClick() {
      if (activeTab === 'yarn') {
        openModal('add-yarn-modal');
      } else if (activeTab === 'projects') {
        openModal('add-idea-modal');
      }
    }

    function renderStats() {
      const total = stash.length;
      if (total === 0) return;

      const withProjects = stash.filter(i => i.project && i.project.trim() !== "").length;
      const scraps = stash.filter(i => i.isScrap).length;
      const newItems = total - scraps;

      document.getElementById('metric-proj').innerText = ((withProjects / total) * 100).toFixed(1) + '%';
      document.getElementById('metric-new').innerText = ((newItems / total) * 100).toFixed(1) + '%';
      document.getElementById('metric-scrap').innerText = ((scraps / total) * 100).toFixed(1) + '%';

      const weightCounts = {};
      stash.forEach(i => {
        const w = (i.weight || 'Unknown').trim();
        weightCounts[w] = (weightCounts[w] || 0) + 1;
      });
      const sortedWeights = Object.entries(weightCounts).sort((a,b) => b[1] - a[1]);
      const maxWeightCount = sortedWeights[0] ? sortedWeights[0][1] : 1;

      document.getElementById('weight-bars').innerHTML = sortedWeights.map(([weight, count]) => `
        <div class="bar-row">
          <div class="bar-label">${weight}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width: ${(count / maxWeightCount) * 100}%"></div>
          </div>
          <div class="bar-count">${count}</div>
        </div>
      `).join('');

      const colourCounts = {};
      stash.forEach(i => {
        const c = (i.colour || 'Other').trim();
        colourCounts[c] = (colourCounts[c] || 0) + 1;
      });
      const sortedColours = Object.entries(colourCounts).sort((a,b) => b[1] - a[1]);
      const maxColourCount = sortedColours[0] ? sortedColours[0][1] : 1;

      document.getElementById('colour-bars').innerHTML = sortedColours.map(([colour, count]) => `
        <div class="bar-row">
          <div class="bar-label">${colour}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width: ${(count / maxColourCount) * 100}%; background: #b8a6d6;"></div>
          </div>
          <div class="bar-count">${count}</div>
        </div>
      `).join('');
    }

    function render() {
      if (activeTab === 'stats') {
        renderStats();
        return;
      }

      const query = document.getElementById('search-bar').value.toLowerCase();
      const allProjects = getAllProjectsList();

      if (activeTab === 'yarn') {
        const filtered = stash.filter(item => {
          const matchQuery = (item.name + " " + item.colour + " " + (item.shade || '') + " " + item.weight).toLowerCase().includes(query);
          if (!matchQuery) return false;
          if (currentFilter === 'all') return true;
          if (currentFilter === 'unassigned') return !item.project;
          if (currentFilter === 'in-project') return Boolean(item.project);
          if (currentFilter === 'scrap') return item.isScrap;
          return item.weight === currentFilter;
        });

        document.getElementById('yarn-list').innerHTML = filtered.map(item => `
          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">${item.name || 'Unnamed Skein'}</div>
                <div class="card-subtitle">${item.colour} ${item.shade ? '• Shade ' + item.shade : ''}</div>
              </div>
              <span class="tag">${item.weight}</span>
            </div>
            <div class="tags">
              ${item.hook ? `<span class="tag">Hook: ${item.hook}mm</span>` : ''}
              ${item.isScrap ? `<span class="tag scrap">Scrap</span>` : '<span class="tag">Full Skein</span>'}
              ${item.hasTag ? `<span class="tag">🏷️ Tag</span>` : ''}
              ${item.project ? `<span class="tag project">🧵 ${item.project}</span>` : ''}
            </div>
            <div class="card-actions">
              <select class="assign-select" onchange="assignProject(${item.rowIndex}, this.value)">
                <option value="">-- Assign Project --</option>
                ${allProjects.map(p => `<option value="${p}" ${item.project === p ? 'selected' : ''}>${p}</option>`).join('')}
                <option value="__NEW__">+ New Project...</option>
              </select>
              <button class="delete-btn" onclick="deleteYarn(${item.rowIndex})">Delete</button>
            </div>
          </div>
        `).join('');
      } else if (activeTab === 'projects') {
        // Planner List
        document.getElementById('planner-list').innerHTML = planner.map(p => `
          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">🧶 ${p.name}</div>
                <div class="card-subtitle">Pattern: ${p.pattern} ${p.hook ? '• Hook ' + p.hook : ''}</div>
              </div>
              <span class="tag ${p.status === 'Complete' ? 'status-complete' : 'status-ready'}">${p.status}</span>
            </div>
            <div class="tags">
              ${p.yarn ? `<span class="tag">Yarn: ${p.yarn}</span>` : ''}
            </div>
            ${p.notes ? `<div class="card-notes"><b>Note:</b> ${p.notes}</div>` : ''}
            <div class="card-actions">
              <button class="btn-action" onclick="openEditPlanner(${p.rowIndex})">✏️ Edit</button>
            </div>
          </div>
        `).join('');

        // Ideas List
        document.getElementById('ideas-list').innerHTML = ideas.map(i => `
          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">💡 ${i.name}</div>
                <div class="card-subtitle">${i.where || ''} ${i.paid > 0 ? '• £' + i.paid : ''}</div>
              </div>
              <span class="tag ${i.doing === 'Yes' ? 'status-doing' : ''}">${i.doing}</span>
            </div>
            <div class="tags">
              ${i.yarn && i.yarn !== '-' ? `<span class="tag">Yarn: ${i.yarn}</span>` : ''}
              ${i.hook && i.hook !== '-' ? `<span class="tag">Hook: ${i.hook}</span>` : ''}
              ${i.patternLink && i.patternLink.startsWith('http') ? `<a href="${i.patternLink}" target="_blank" class="link-btn">🔗 Open Pattern</a>` : ''}
            </div>
            ${i.notes ? `<div class="card-notes"><b>Note:</b> ${i.notes}</div>` : ''}
            <div class="card-actions">
              <button class="btn-action" onclick="openEditIdea(${i.rowIndex})">✏️ Edit</button>
            </div>
          </div>
        `).join('');

        // Rough Notes
        document.getElementById('notes-list').innerHTML = roughNotes.map((n, idx) => `
          <div class="rough-note-item">
            <span>• ${typeof n === 'object' ? n.text : n}</span>
            <button class="delete-btn" onclick="deleteQuickNote(${idx})">✕</button>
          </div>
        `).join('');
      }
    }

    // --- EDIT PLANNER MODAL HANDLERS ---
    function openEditPlanner(rowIndex) {
      const p = planner.find(item => item.rowIndex === rowIndex);
      if (!p) return;
      document.getElementById('edit-p-row').value = p.rowIndex;
      document.getElementById('edit-p-name').value = p.name || '';
      document.getElementById('edit-p-pattern').value = p.pattern || '';
      document.getElementById('edit-p-status').value = p.status || 'Ready to go';
      document.getElementById('edit-p-yarn').value = p.yarn || '';
      document.getElementById('edit-p-hook').value = p.hook || '';
      document.getElementById('edit-p-notes').value = p.notes || '';
      openModal('edit-planner-modal');
    }

    function saveEditedPlanner() {
      const rowIndex = Number(document.getElementById('edit-p-row').value);
      const item = {
        name: document.getElementById('edit-p-name').value.trim(),
        pattern: document.getElementById('edit-p-pattern').value.trim(),
        status: document.getElementById('edit-p-status').value,
        yarn: document.getElementById('edit-p-yarn').value.trim(),
        hook: document.getElementById('edit-p-hook').value.trim(),
        notes: document.getElementById('edit-p-notes').value.trim()
      };
      const target = planner.find(p => p.rowIndex === rowIndex);
      if (target) Object.assign(target, item);
      render();
      closeModal('edit-planner-modal');
      postAction({ action: 'UPDATE_PLANNER_ROW', rowIndex, item });
    }

    function deletePlannerItem() {
      if (!confirm("Are you sure you want to delete this project?")) return;
      const rowIndex = Number(document.getElementById('edit-p-row').value);
      planner = planner.filter(p => p.rowIndex !== rowIndex);
      render();
      closeModal('edit-planner-modal');
      postAction({ action: 'DELETE_ROW', rowIndex });
    }

    // --- EDIT IDEA MODAL HANDLERS ---
    function openEditIdea(rowIndex) {
      const i = ideas.find(item => item.rowIndex === rowIndex);
      if (!i) return;
      document.getElementById('edit-i-row').value = i.rowIndex;
      document.getElementById('edit-i-name').value = i.name || '';
      document.getElementById('edit-i-link').value = i.patternLink || '';
      document.getElementById('edit-i-where').value = i.where || '';
      document.getElementById('edit-i-paid').value = i.paid || '';
      document.getElementById('edit-i-yarn').value = i.yarn || '';
      document.getElementById('edit-i-hook').value = i.hook || '';
      document.getElementById('edit-i-doing').value = i.doing || 'Not started';
      document.getElementById('edit-i-notes').value = i.notes || '';
      openModal('edit-idea-modal');
    }

    function saveEditedIdea() {
      const rowIndex = Number(document.getElementById('edit-i-row').value);
      const item = {
        name: document.getElementById('edit-i-name').value.trim(),
        patternLink: document.getElementById('edit-i-link').value.trim(),
        where: document.getElementById('edit-i-where').value.trim(),
        paid: document.getElementById('edit-i-paid').value.trim(),
        yarn: document.getElementById('edit-i-yarn').value.trim(),
        hook: document.getElementById('edit-i-hook').value.trim(),
        doing: document.getElementById('edit-i-doing').value,
        notes: document.getElementById('edit-i-notes').value.trim()
      };
      const target = ideas.find(i => i.rowIndex === rowIndex);
      if (target) Object.assign(target, item);
      render();
      closeModal('edit-idea-modal');
      postAction({ action: 'UPDATE_IDEA_ROW', rowIndex, item });
    }

    function deleteIdeaItem() {
      if (!confirm("Are you sure you want to delete this idea?")) return;
      const rowIndex = Number(document.getElementById('edit-i-row').value);
      ideas = ideas.filter(i => i.rowIndex !== rowIndex);
      render();
      closeModal('edit-idea-modal');
      postAction({ action: 'DELETE_ROW', rowIndex });
    }

    // --- YARN & QUICK NOTES HANDLERS ---
    function assignProject(rowIndex, value) {
      let finalProject = value;
      if (value === '__NEW__') {
        const custom = prompt('Enter new project name:');
        if (!custom) return render();
        finalProject = custom.trim();
      }
      const item = stash.find(i => i.rowIndex === rowIndex);
      if (item) item.project = finalProject;
      render();
      postAction({ action: 'UPDATE_PROJECT', rowIndex, project: finalProject });
    }

    function deleteYarn(rowIndex) {
      if (!confirm("Remove this yarn from stock?")) return;
      stash = stash.filter(i => i.rowIndex !== rowIndex);
      render();
      postAction({ action: 'DELETE_YARN', rowIndex });
    }

    function saveNewYarn() {
      const name = document.getElementById('new-name').value.trim();
      if (!name) return alert('Please enter a name');
      const yarn = {
        name,
        weight: document.getElementById('new-weight').value,
        colour: document.getElementById('new-colour').value.trim() || 'Assorted',
        shade: document.getElementById('new-shade').value.trim(),
        hook: document.getElementById('new-hook').value.trim(),
        isScrap: document.getElementById('new-is-scrap').checked,
        hasTag: document.getElementById('new-has-tag').checked,
        project: document.getElementById('new-project').value.trim()
      };
      stash.unshift({ ...yarn, rowIndex: stash.length + 2 });
      render();
      closeModal('add-yarn-modal');
      postAction({ action: 'ADD_YARN', yarn });
    }

    function saveNewIdea() {
      const name = document.getElementById('idea-name').value.trim();
      if (!name) return alert('Please enter a project idea name');
      const idea = {
        name,
        patternLink: document.getElementById('idea-link').value.trim(),
        where: document.getElementById('idea-where').value.trim(),
        paid: document.getElementById('idea-paid').value.trim(),
        yarn: document.getElementById('idea-yarn').value.trim(),
        hook: document.getElementById('idea-hook').value.trim(),
        doing: document.getElementById('idea-doing').value,
        notes: document.getElementById('idea-notes').value.trim()
      };
      ideas.unshift(idea);
      render();
      closeModal('add-idea-modal');
      postAction({ action: 'ADD_IDEA', idea });
    }

    function saveQuickNote() {
      const input = document.getElementById('quick-note-input');
      const note = input.value.trim();
      if (!note) return;
      roughNotes.push(note);
      input.value = '';
      render();
      postAction({ action: 'ADD_NOTE', note });
    }

    function deleteQuickNote(idx) {
      const noteObj = roughNotes[idx];
      roughNotes.splice(idx, 1);
      render();
      if (typeof noteObj === 'object' && noteObj.rowIndex) {
        postAction({ action: 'DELETE_ROW', rowIndex: noteObj.rowIndex });
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.getElementById('search-bar').addEventListener('input', render);
    fetchFromSheet();
  </script>
</body>
</html>
